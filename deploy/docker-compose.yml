services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=archivedex;Username=archivedex;Password=${DB_PASSWORD:-archivedex}
      - TesseractOcr__ImageBasePath=/app/images
      - TesseractOcr__TessDataPath=/usr/share/tesseract-ocr/5/tessdata
      - TesseractOcr__DefaultLanguages=eng+deu+jpn+kor+chi_sim+chi_tra
    volumes:
      - images:/app/images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archivedex
      POSTGRES_USER: archivedex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archivedex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivedex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  images:
  pgdata:
