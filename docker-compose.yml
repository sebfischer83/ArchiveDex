services:
  archivedex.server:
    image: ${DOCKER_REGISTRY-}archivedexserver
    build:
      context: .
      dockerfile: src/ArchiveDex.Server/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__PostgreSQL: "Host=db;Database=archivedex;Username=archivedex;Password=${DB_PASSWORD:-archivedex-dev-local}"
      DataProtection__Path: "/app/dataprotection"
      Security__RequireHttpsCookies: "false"
      AI__Provider: "${AI_PROVIDER:-unavailable}"
      AI__OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      AI__Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      Owner__UserName: "${OWNER_USERNAME:-owner}"
      Owner__Password: "${OWNER_PASSWORD:-owner-dev-local}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dataprotectionkeys:/app/dataprotection
    ports:
      - "8080:8080"

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: archivedex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archivedex-dev-local}
      POSTGRES_DB: archivedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivedex -d archivedex"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata18:
  dataprotectionkeys:
