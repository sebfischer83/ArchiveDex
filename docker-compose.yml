services:
  archivedex.web:
    image: ${DOCKER_REGISTRY-}archivedexweb
    build:
      context: .
      dockerfile: src/ArchiveDex.Web/Dockerfile
    depends_on:
      - postgres
    environment:
      - TesseractOcr__ImageBasePath=/app/images
      - TesseractOcr__TessDataPath=/usr/share/tesseract-ocr/5/tessdata
      - TesseractOcr__DefaultLanguages=eng+deu+jpn+kor+chi_sim+chi_tra
    volumes:
      - images:/app/images

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archivedex
      POSTGRES_USER: archivedex
      POSTGRES_PASSWORD: archivedex
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@archive.dex
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmindata:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmindata:
  images:
