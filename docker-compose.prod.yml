services:
  web:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__PostgreSQL: "Host=db;Database=archivedex;Username=archivedex;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
      Security__RequireHttpsCookies: "${REQUIRE_HTTPS_COOKIES:-false}"
      DataTransfer__MaxArchiveBytes: "${DATA_TRANSFER_MAX_ARCHIVE_BYTES:-42949672960}"
      AI__Provider: "${AI_PROVIDER:-unavailable}"
      AI__OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      AI__OpenAI__Model: "${OPENAI_MODEL:-gpt-5.6-luna}"
      AI__Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      AI__Anthropic__Model: "${ANTHROPIC_MODEL:-claude-sonnet-4-5}"
      AI__Valuation__Provider: "${VALUATION_PROVIDER:-openai}"
      Owner__UserName: "${OWNER_USERNAME:-}"
      Owner__Password: "${OWNER_PASSWORD:-}"
    volumes:
      - dataprotectionkeys:/app/dataprotection
      - archivedexlogs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: archivedex
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: archivedex
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivedex -d archivedex"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata18:
  dataprotectionkeys:
  archivedexlogs:
