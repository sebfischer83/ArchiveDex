openapi: "3.0.3"
info:
  title: Catalog Import Mode Extension
  description: Add-only mode contract for the existing Catalog Import API
  version: "1.0.0"

paths:
  /api/catalog-imports:
    post:
      summary: Start a catalog import run
      description: |
        Creates a new catalog import run. The `mode` field selects between
        the existing update-capable mode (default) and add-only mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCatalogImportRequest"
      responses:
        "201":
          description: Import run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportRunDto"
        "409":
          description: Another import or transfer is already active

  /api/catalog-imports/{importRunId}:
    get:
      summary: Get import run status
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run details including mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportRunDto"
        "404":
          description: Run not found

  /api/catalog-imports/{importRunId}/report:
    get:
      summary: Get import report
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detailed report including mode-specific counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportReportDto"
        "404":
          description: Run not found

components:
  schemas:
    CatalogImportMode:
      type: string
      enum:
        - Update
        - AddOnly
      description: |
        - `Update`: Existing behavior — creates new cards and updates existing ones.
        - `AddOnly`: Creates new cards and their prerequisite sets; skips all existing catalog items without modification.

    StartCatalogImportRequest:
      type: object
      properties:
        sources:
          type: array
          items:
            type: string
          example: ["TCGdex", "Limitless", "Serebii"]
        languagesBySource:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            TCGdex: ["en", "de", "ja"]
        dryRun:
          type: boolean
          default: false
        downloadImages:
          type: boolean
          default: true
        reanalyzeExistingImages:
          type: boolean
          default: true
        mode:
          $ref: "#/components/schemas/CatalogImportMode"
          default: Update
      required:
        - sources
        - languagesBySource

    CatalogImportRunDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Running, Cancelling, Cancelled, Completed, Failed]
        mode:
          $ref: "#/components/schemas/CatalogImportMode"
        isDryRun:
          type: boolean
        downloadImages:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        importedCount:
          type: integer
        updatedCount:
          type: integer
        mergedCount:
          type: integer
        skippedCount:
          type: integer
        addedCount:
          type: integer
          description: Cards added during this run (populated in add-only mode)
        addedSupportingItemCount:
          type: integer
          description: Supporting sets added during this run (or that would be added in preview)
        ambiguousCount:
          type: integer
          description: Cards that could not be uniquely classified
        errorCount:
          type: integer
        warningCount:
          type: integer
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/CatalogImportCheckpointDto"

    CatalogImportCheckpointDto:
      type: object
      properties:
        source:
          type: string
        language:
          type: string
        setExternalId:
          type: string
          nullable: true
        phase:
          type: string
        isCompleted:
          type: boolean
        processedCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CatalogImportReportDto:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/CatalogImportRunDto"
        sourceSummaries:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummaryDto"
        imageSummary:
          $ref: "#/components/schemas/ImageQualitySummaryDto"
        pendingMappingCount:
          type: integer
        ambiguousCardCount:
          type: integer
          description: Number of cards flagged for administrator review

    SourceSummaryDto:
      type: object
      properties:
        source:
          type: string
        language:
          type: string
        setsProcessed:
          type: integer
        cardsProcessed:
          type: integer
        errors:
          type: integer
        warnings:
          type: integer

    ImageQualitySummaryDto:
      type: object
      properties:
        selectedImages:
          type: integer
        failedDownloads:
          type: integer
        cardsWithoutImages:
          type: integer
        setsWithoutImages:
          type: integer
        candidatesAnalyzed:
          type: integer
