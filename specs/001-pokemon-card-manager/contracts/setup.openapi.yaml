openapi: 3.1.0
info:
  title: ArchiveDex Setup API
  version: 1.0.0
  description: First-run setup wizard. Available only while setup is incomplete (FR-001).
paths:
  /api/setup/state:
    get:
      summary: Get setup completion state (FR-001/FR-004)
      responses:
        "200":
          description: Current setup state
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSetupComplete: { type: boolean }
  /api/setup/validate:
    post:
      summary: Validate DB connection and storage path without completing setup (FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseReachable: { type: boolean }
                  storageWritable: { type: boolean }
                  messages: { type: array, items: { type: string } }
  /api/setup/complete:
    post:
      summary: Complete setup atomically; provisions admin + config (FR-002..FR-007)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Setup completed; admin signed in
        "400":
          description: Validation failure
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Setup already completed (FR-004)
components:
  schemas:
    SetupRequest:
      type: object
      required: [adminUserName, adminPassword, defaultUiCulture, collectionCurrency, imageStoragePath, databaseMode]
      properties:
        adminUserName: { type: string }
        adminPassword: { type: string, format: password }
        defaultUiCulture: { type: string, enum: [de, en, ru] }
        collectionCurrency: { type: string, description: ISO 4217 code }
        imageStoragePath: { type: string }
        databaseMode: { type: string, enum: [Embedded, External] }
        databaseConnectionString: { type: string, nullable: true }
        importSettings: { type: object, nullable: true }
        ocrSettings: { type: object, nullable: true }
        scannerDefaults: { type: object, nullable: true }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        status: { type: integer }
