openapi: 3.1.0
info:
  title: ArchiveDex Scanner & OCR API
  version: 1.0.0
  description: Mobile scanner upload, server OCR, and match suggestions (FR-016..FR-023).
paths:
  /api/scans:
    post:
      summary: Upload a card photo; stores image and creates a scan job (FR-016/FR-017/FR-023)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/WebP, max 10 MB (FR-023)
                cardLanguageHint:
                  type: string
                  enum: [de, en, ja, ko, zh-Hans, zh-Hant]
                  nullable: true
      responses:
        "201":
          description: Scan job created (status Uploaded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "415":
          description: Unsupported image format
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: Image exceeds 10 MB
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/scans/{scanId}:
    get:
      summary: Get scan job incl. OCR result and ranked candidate matches (FR-018..FR-020)
      parameters:
        - { name: scanId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Scan job with OCR result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
  /api/scans/{scanId}/confirm:
    post:
      summary: Confirm a match and add to collection (FR-021/FR-022/FR-024). Never auto-confirms.
      parameters:
        - { name: scanId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, condition, quantity]
              properties:
                cardId: { type: string }
                condition: { type: string, enum: [NM, LP, MP, HP, DMG] }
                quantity: { type: integer, minimum: 1 }
                purchasePrice: { type: number, nullable: true }
                storageLocation: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "201": { description: Collection entry created, linked to stored front image }
  /api/scans/{scanId}/reject:
    post:
      summary: Reject all suggestions (no card added) (FR-021/FR-022)
      parameters:
        - { name: scanId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Scan rejected }
components:
  schemas:
    ScanJob:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [Uploaded, OcrRunning, OcrComplete, Confirmed, Failed, Rejected] }
        imageUrl: { type: string }
        ocr:
          type: object
          nullable: true
          properties:
            detectedNumber: { type: string, nullable: true }
            detectedName: { type: string, nullable: true }
            detectedCardLanguage: { type: string, nullable: true }
            detectedSetHint: { type: string, nullable: true }
            confidence: { type: number, nullable: true }
            candidates:
              type: array
              items:
                type: object
                properties:
                  cardId: { type: string }
                  score: { type: number }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        status: { type: integer }
