openapi: 3.0.3
info:
  title: ArchiveDex Catalog Transfer API
  version: 0.1.0
  description: Administrator-only API for exporting, validating, importing, monitoring, and downloading full catalog transfer packages.
paths:
  /api/catalog-transfers/exports:
    post:
      summary: Start an asynchronous full catalog export
      operationId: startCatalogExport
      responses:
        '202': { description: Export operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogTransferOperation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog-transfers/imports/validate:
    post:
      summary: Upload and validate a package without changing target catalog content
      operationId: validateCatalogImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string, format: binary }
      responses:
        '202': { description: Validation operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogTransferOperation' } } } }
        '400': { $ref: '#/components/responses/TransferError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog-transfers/imports/{operationId}/start:
    post:
      summary: Start restoration after successful validation
      operationId: startCatalogImport
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '202': { description: Import operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogTransferOperation' } } } }
        '400': { $ref: '#/components/responses/TransferError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Operation not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog-transfers/active:
    get:
      summary: Get the active transfer or null
      operationId: getActiveCatalogTransfer
      responses:
        '200': { description: Active operation or null, content: { application/json: { schema: { nullable: true, $ref: '#/components/schemas/CatalogTransferOperation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/catalog-transfers/{operationId}:
    get:
      summary: Get transfer status and progress
      operationId: getCatalogTransfer
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '200': { description: Operation status, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogTransferOperation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Operation not found }
  /api/catalog-transfers/{operationId}/cancel:
    post:
      summary: Request cancellation and cleanup
      operationId: cancelCatalogTransfer
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '202': { description: Cancellation requested }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Operation not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog-transfers/{operationId}/report:
    get:
      summary: Get validated counts, outcome, and actionable warnings/errors
      operationId: getCatalogTransferReport
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '200': { description: Transfer report, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogTransferReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Operation not found }
  /api/catalog-transfers/{operationId}/package:
    get:
      summary: Download a completed, verified export package
      operationId: downloadCatalogExport
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '200': { description: Package stream, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Operation or package not found }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Administrator authorization required }
    Conflict:
      description: A catalog transfer or catalog-changing operation is active, or the operation is not in the required state
      content: { application/json: { schema: { $ref: '#/components/schemas/TransferError' } } }
    TransferError:
      description: Validation or expected transfer failure
      content: { application/json: { schema: { $ref: '#/components/schemas/TransferError' } } }
  schemas:
    CatalogTransferOperation:
      type: object
      required: [id, kind, status, phase, processedRecords, totalRecords, processedImages, totalImages, processedImageBytes, totalImageBytes, errorCount, warningCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [Export, Import] }
        status: { type: string, enum: [Pending, Validating, Running, Cancelling, Cancelled, Completed, Failed, Interrupted] }
        phase: { type: string, enum: [AcquireLease, Snapshot, Package, Verify, StageImages, RestoreCatalog, Finalize, Cleanup, Report] }
        packageId: { type: string, format: uuid, nullable: true }
        formatVersion: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        processedRecords: { type: integer, format: int64 }
        totalRecords: { type: integer, format: int64 }
        processedImages: { type: integer, format: int64 }
        totalImages: { type: integer, format: int64 }
        processedImageBytes: { type: integer, format: int64 }
        totalImageBytes: { type: integer, format: int64 }
        validationSucceeded: { type: boolean, nullable: true }
        errorCount: { type: integer }
        warningCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CatalogTransferReport:
      type: object
      required: [operation, categoryCounts, errors]
      properties:
        operation: { $ref: '#/components/schemas/CatalogTransferOperation' }
        categoryCounts: { type: object, additionalProperties: { type: integer, format: int64 } }
        errors: { type: array, items: { $ref: '#/components/schemas/TransferError' } }
    TransferError:
      type: object
      required: [code, message, impact, recommendedAction]
      properties:
        code: { type: string, example: PACKAGE_HASH_MISMATCH }
        check: { type: string, nullable: true }
        itemPath: { type: string, nullable: true }
        message: { type: string }
        impact: { type: string }
        recommendedAction: { type: string }
