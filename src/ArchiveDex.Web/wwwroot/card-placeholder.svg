<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#F5F2EE"/>
      <stop offset="100%" stop-color="#EDE9E3"/>
    </linearGradient>
    <linearGradient id="top" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <clipPath id="topClip">
      <rect x="68" y="103" width="114" height="57"/>
    </clipPath>
    <clipPath id="botClip">
      <rect x="68" y="160" width="114" height="57"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card body -->
  <rect width="250" height="350" rx="14" fill="url(#bg)"/>

  <!-- Subtle dot texture -->
  <g opacity="0.35">
    <circle cx="30"  cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="60"  cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="90"  cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="120" cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="150" cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="180" cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="210" cy="30"  r="1.2" fill="#C8C2BB"/>
    <circle cx="45"  cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="75"  cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="105" cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="135" cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="165" cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="195" cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="225" cy="55"  r="1.2" fill="#C8C2BB"/>
    <circle cx="30"  cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="60"  cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="90"  cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="120" cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="150" cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="180" cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="210" cy="295" r="1.2" fill="#C8C2BB"/>
    <circle cx="45"  cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="75"  cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="105" cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="135" cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="165" cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="195" cy="320" r="1.2" fill="#C8C2BB"/>
    <circle cx="225" cy="320" r="1.2" fill="#C8C2BB"/>
  </g>

  <!-- Inner frame -->
  <rect x="10" y="10" width="230" height="330" rx="9"
        fill="none" stroke="#DDD8D1" stroke-width="1.5"/>

  <!-- Pokéball shadow -->
  <circle cx="125" cy="162" r="59" fill="#D8D3CC" opacity="0.25"/>

  <!-- Pokéball — top half (blue) -->
  <path d="M68,160 A57,57 0 0 1 182,160 Z"
        fill="url(#top)" clip-path="url(#topClip)"/>

  <!-- Pokéball — bottom half (white-ish) -->
  <path d="M68,160 A57,57 0 0 0 182,160 Z"
        fill="#FAFAF9" opacity="0.9" clip-path="url(#botClip)"/>

  <!-- Pokéball outer ring -->
  <circle cx="125" cy="160" r="57"
          fill="none" stroke="#C8C2BB" stroke-width="2.5"/>

  <!-- Divider bar -->
  <rect x="68" y="156.5" width="114" height="7" rx="3.5"
        fill="#DDD8D1"/>

  <!-- Center button shadow -->
  <circle cx="125" cy="160" r="18" fill="#C8C2BB" opacity="0.3"/>

  <!-- Center button body -->
  <circle cx="125" cy="160" r="15"
          fill="#F5F2EE" stroke="#C8C2BB" stroke-width="2.5"/>

  <!-- Center button inner dot -->
  <circle cx="125" cy="160" r="6" fill="#DDD8D1"/>

  <!-- Label -->
  <text x="125" y="252"
        text-anchor="middle"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="11" font-weight="600"
        fill="#B5AFA8" letter-spacing="0.12em">
    NO IMAGE
  </text>
</svg>
