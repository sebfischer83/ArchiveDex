name: Develop CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test-coverage:
    name: Build, Test, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('ArchiveDex.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "ArchiveDex.slnx"

      - name: Build
        run: dotnet build "ArchiveDex.slnx" --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test "ArchiveDex.slnx"
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --collect:"XPlat Code Coverage"
          --results-directory "./TestResults"

      - name: Generate coverage report
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub
          verbosity: Info

      - name: Publish test results
        if: always() && hashFiles('TestResults/**/*.trx') != ''
        uses: dorny/test-reporter@v1
        with:
          name: .NET Test Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Add coverage summary
        if: always()
        run: |
          if [ -f CoverageReport/SummaryGithub.md ]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn
