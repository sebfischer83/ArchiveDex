name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env: { POSTGRES_USER: archivedex, POSTGRES_PASSWORD: archivedex, POSTGRES_DB: archivedex }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build
      - run: dotnet test --no-build
